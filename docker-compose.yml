services:
  openclaw:
    build:
      context: .
    container_name: openclaw-private-assistant
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OPENCLAW_HOST: 0.0.0.0
      OPENCLAW_PORT: 8080
      MEMORY_BACKEND: sqlite
      SQLITE_PATH: /data/openclaw.db
    ports:
      - "127.0.0.1:${OPENCLAW_PORT:-8080}:8080"
    volumes:
      - openclaw-memory:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  openclaw-memory:
